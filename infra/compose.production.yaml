# Apply with the base file for public, single-VM deployments:
# docker compose -f infra/compose.yaml -f infra/compose.production.yaml up -d --build
# Requires APP_HOST, APP_BASE_URL, and ACME_EMAIL in the repo-root .env.
services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  app:
    restart: unless-stopped

  backup:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  beat:
    restart: unless-stopped

  frontend:
    image: linsuite-frontend:production
    build:
      context: ../app
      dockerfile: frontend/Dockerfile.production
    command: ["nginx", "-g", "daemon off;"]
    volumes: !reset []
    labels:
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    restart: unless-stopped

  traefik:
    # Compose replaces command rather than appending it. Keep the base Docker provider
    # flags here, then add HTTP -> HTTPS and Let's Encrypt HTTP-01 for the public domain.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

volumes:
  letsencrypt:
