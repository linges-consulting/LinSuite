name: linsuite

x-backend: &backend
  build: ../app/backend
  env_file: ../.env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      # Holds the 0600 first-run setup token; kept out of the image so a rebuild or a
      # `docker compose down` without `-v` does not silently re-open setup.
      - appdata:/var/lib/linsuite
    labels:
      traefik.enable: "true"
      # Longer rule = higher default priority, so /api wins over the frontend's catch-all.
      traefik.http.routers.app.rule: Host(`${APP_HOST:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.app.entrypoints: web
      traefik.http.routers.app.middlewares: api-ratelimit@docker
      traefik.http.services.app.loadbalancer.server.port: "8000"

      # Blunt per-IP volumetric limits (tech-stack §14). Deliberately *not* application code:
      # this is about traffic, and it must refuse a flood before it reaches a worker, a
      # database connection or an Argon2 verify. The per-account throttling that actually
      # defends a credential lives in `auth/throttle.py`, because distributed credential
      # stuffing walks straight past an IP limit and a clinic behind one NAT is one IP.
      #
      # `average` requests per `period`, refilled steadily, with `burst` allowed at once.
      # General API: 300/minute (5/s) with a burst of 100 — a staff member loading a busy
      # calendar fires a handful of requests, nothing near this.
      traefik.http.middlewares.api-ratelimit.ratelimit.average: "300"
      traefik.http.middlewares.api-ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.api-ratelimit.ratelimit.burst: "100"
      # Credentials: 60/minute (1/s) with a burst of 20. Chosen against the real floor —
      # `/auth/me` is polled every 5s while Admin Mode is open, so roughly 12/minute per open
      # tab — which leaves room for several tabs and still turns a password-guessing burst
      # into one attempt a second per address.
      traefik.http.middlewares.auth-ratelimit.ratelimit.average: "60"
      traefik.http.middlewares.auth-ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.auth-ratelimit.ratelimit.burst: "20"
      # Its own router onto the same service, so the tighter bucket applies to the credential
      # endpoints only. Priority is explicit rather than left to rule length: a later, longer
      # rule on the `app` router would otherwise silently take these paths back.
      traefik.http.routers.auth.rule: Host(`${APP_HOST:-localhost}`) && PathPrefix(`/api/auth`)
      traefik.http.routers.auth.entrypoints: web
      # Well above any rule length: the default priority *is* the rule's length, and a long
      # production FQDN in APP_HOST would push the `app` router past a smaller number here —
      # silently putting the credential endpoints back on the loose bucket.
      traefik.http.routers.auth.priority: "1000"
      traefik.http.routers.auth.service: app
      traefik.http.routers.auth.middlewares: auth-ratelimit@docker

  worker:
    <<: *backend
    command: celery -A core.celery_app worker --loglevel=info

  # Vite dev server serving the React shell; a production image is a later task.
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../app/frontend:/app
      - frontend_node_modules:/app/node_modules # Linux binaries, kept off the host tree
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: Host(`${APP_HOST:-localhost}`)
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.services.frontend.loadbalancer.server.port: "5173"

  traefik:
    # 3.7+ required: older 3.x pin a Docker API version that Engine 29 rejects.
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app
      - frontend

volumes:
  appdata:
  pgdata:
  redisdata:
  frontend_node_modules:
