<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A form link (/f/#<token>) carries its token in the URL's fragment: nothing this page
         loads may be told where it came from. Fetches that need `Origin` opt back in per
         request. -->
    <meta name="referrer" content="no-referrer" />
    <title>LinSuite</title>
    <script>
      // Apply the stored theme before first paint so there is no light flash. Mirrors src/lib/theme.tsx.
      try {
        var t = localStorage.getItem('theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
