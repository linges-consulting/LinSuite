[project]
name = "linsuite"
version = "0.1.0"
description = "LinSuite backend: single-tenant white-label business & practice manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "redis>=5",
    # The HaveIBeenPwned k-anonymity client (core/security.py) runs in request handlers.
    "httpx>=0.27",
    "pyotp>=2.9",
    "cryptography>=43",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "holidays>=0.104",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # 4.15+: `testcontainers.community.postgres`, and `testcontainers.redis` needs no extra
    # (the `redis` client is already a runtime dependency).
    "testcontainers[postgres]>=4.15",
    "psycopg[binary]>=3.2",
    "ruff>=0.6",
]

# Not a distributable package: `src/` is the import root and each domain directory
# (core, auth, scheduling, ...) is a top-level package. See CLAUDE.md for the layout.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on files the app wrote; a blocking stat in a test body is not a hazard.
"tests/*" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
# The local `alembic/` scripts directory shadows the library name for import sorting.
known-third-party = ["alembic"]
